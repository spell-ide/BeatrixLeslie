name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to package and publish (e.g. v1.0.1); leave empty to package without publishing'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Package
    uses: ./.github/workflows/_build.yml
    with:
      checkout_ref: ${{ inputs.tag || github.ref }}
      package_artifacts: true
    secrets: inherit

  publish:
    name: Publish Release & Checksums
    runs-on: ubuntu-24.04
    needs:
      - build
    steps:
      - name: Download platform archives
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate SHA256SUMS.txt
        run: |
          cd release-assets
          sha256sum \
            BeatrixLeslieIDE-macos-arm64.zip \
            BeatrixLeslieIDE-macos-x86_64.zip \
            BeatrixLeslieIDE-linux-x86_64.AppImage \
            BeatrixLeslieIDE-linux-x86_64.tar.gz \
            BeatrixLeslieIDE-windows-x86_64.zip \
            > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload SHA256SUMS.txt artifact
        uses: actions/upload-artifact@v4
        with:
          name: SHA256SUMS
          path: release-assets/SHA256SUMS.txt
          if-no-files-found: error

      - name: Checkout CHANGELOG
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          path: src
          sparse-checkout: CHANGELOG.md
          sparse-checkout-cone-mode: false

      - name: Extract release notes from CHANGELOG.md
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          VER="${TAG#v}"
          awk -v ver="${VER}" '
            $0 ~ "^## \\[" ver "\\]" { on=1; next }
            on && /^## \[/ { exit }
            on { print }
          ' src/CHANGELOG.md > RELEASE_NOTES.md
          printf '\nVerify downloads with `SHA256SUMS.txt`. macOS builds are signed and notarized (Developer ID).\n' >> RELEASE_NOTES.md
          test -s RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: BeatrixLeslie IDE ${{ inputs.tag || github.ref_name }}
          body_path: RELEASE_NOTES.md
          make_latest: true
          files: |
            release-assets/BeatrixLeslieIDE-macos-arm64.zip
            release-assets/BeatrixLeslieIDE-macos-x86_64.zip
            release-assets/BeatrixLeslieIDE-linux-x86_64.AppImage
            release-assets/BeatrixLeslieIDE-linux-x86_64.tar.gz
            release-assets/BeatrixLeslieIDE-windows-x86_64.zip
            release-assets/SHA256SUMS.txt
