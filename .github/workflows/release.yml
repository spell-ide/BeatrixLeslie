name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to package and publish (e.g. v1.0.0); leave empty to package without publishing'
        required: false
        type: string

permissions:
  contents: write

jobs:
  macos:
    name: Package macOS (arm64)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install Homebrew dependencies
        run: |
          HOMEBREW_NO_AUTO_UPDATE=1 brew install cmake ninja qtbase qtsvg qscintilla2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/spell_core

      - name: Verify third-party license notices
        run: python3 scripts/generate_third_party_licenses.py --check

      - name: Build, deploy Qt, test, and verify self-contained bundle
        run: ./scripts/build_and_run.sh --install dist --deploy-qt --test --verify-loader

      - name: Create macOS zip archive
        run: |
          ditto -c -k --sequesterRsrc --keepParent dist/BeatrixLeslieIDE.app BeatrixLeslieIDE-macos-arm64.zip

      - name: Upload macOS archive
        uses: actions/upload-artifact@v4
        with:
          name: BeatrixLeslieIDE-macos-arm64
          path: BeatrixLeslieIDE-macos-arm64.zip
          if-no-files-found: error

  linux:
    name: Package Linux (x86_64)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install APT dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            pkg-config \
            qt6-base-dev \
            qt6-svg-dev \
            libqscintilla2-qt6-dev \
            libsecret-1-dev \
            libgl1-mesa-dev \
            libxkbcommon-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/spell_core

      - name: Verify third-party license notices
        run: python3 scripts/generate_third_party_licenses.py --check

      - name: Build, install, test, and verify loader
        run: ./scripts/build_and_run.sh --install dist --test --verify-loader

      - name: Create Linux tar.gz archive
        run: |
          cp -a dist BeatrixLeslieIDE-linux-x86_64
          tar -czf BeatrixLeslieIDE-linux-x86_64.tar.gz BeatrixLeslieIDE-linux-x86_64

      - name: Upload Linux archive
        uses: actions/upload-artifact@v4
        with:
          name: BeatrixLeslieIDE-linux-x86_64
          path: BeatrixLeslieIDE-linux-x86_64.tar.gz
          if-no-files-found: error

  windows:
    name: Package Windows (x86_64)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Configure MSVC developer command prompt
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/spell_core

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.*'
          cache: true

      - name: Build and install QScintilla 2.14.1
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $Url = "https://files.pythonhosted.org/packages/source/Q/QScintilla/QScintilla_src-2.14.1.tar.gz"
          $WorkDir = Join-Path $env:RUNNER_TEMP "qscintilla-build"
          if (Test-Path -LiteralPath $WorkDir) {
              Remove-Item -LiteralPath $WorkDir -Recurse -Force
          }
          New-Item -ItemType Directory -Path $WorkDir -Force | Out-Null
          $TarPath = Join-Path $WorkDir "QScintilla_src-2.14.1.tar.gz"

          & curl.exe --fail --location --retry 5 --retry-delay 2 --retry-all-errors -o $TarPath $Url
          if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
          }

          & tar -xzf $TarPath -C $WorkDir
          if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
          }

          Push-Location (Join-Path $WorkDir "QScintilla_src-2.14.1\src")
          try {
              & qmake "CONFIG+=release" "CONFIG-=debug_and_release" qscintilla.pro
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

              & nmake
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

              & nmake install
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
              Pop-Location
          }

          $QtLibDir = (& qmake -query QT_INSTALL_LIBS).Trim()
          $QtBinDir = (& qmake -query QT_INSTALL_BINS).Trim()
          if ($QtLibDir -and $QtBinDir) {
              $LibDll = Join-Path $QtLibDir "qscintilla2_qt6.dll"
              if ((Test-Path -LiteralPath $LibDll) -and (Test-Path -LiteralPath $QtBinDir)) {
                  Copy-Item -LiteralPath $LibDll -Destination (Join-Path $QtBinDir "qscintilla2_qt6.dll") -Force
              }
          }

      - name: Verify third-party license notices
        shell: pwsh
        run: |
          & python scripts/generate_third_party_licenses.py --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build, deploy Qt, test, and verify loader
        shell: pwsh
        run: .\scripts\build_and_run.ps1 -InstallPrefix dist -DeployQt -Test -VerifyLoader

      - name: Create Windows zip archive
        shell: pwsh
        run: |
          Compress-Archive -Path "dist\bin\*" -DestinationPath "BeatrixLeslieIDE-windows-x86_64.zip" -Force

      - name: Upload Windows archive
        uses: actions/upload-artifact@v4
        with:
          name: BeatrixLeslieIDE-windows-x86_64
          path: BeatrixLeslieIDE-windows-x86_64.zip
          if-no-files-found: error

  publish:
    name: Publish Release & Checksums
    runs-on: ubuntu-24.04
    needs:
      - macos
      - linux
      - windows
    steps:
      - name: Download platform archives
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate SHA256SUMS.txt
        run: |
          cd release-assets
          sha256sum \
            BeatrixLeslieIDE-macos-arm64.zip \
            BeatrixLeslieIDE-linux-x86_64.tar.gz \
            BeatrixLeslieIDE-windows-x86_64.zip \
            > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload SHA256SUMS.txt artifact
        uses: actions/upload-artifact@v4
        with:
          name: SHA256SUMS
          path: release-assets/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            release-assets/BeatrixLeslieIDE-macos-arm64.zip
            release-assets/BeatrixLeslieIDE-linux-x86_64.tar.gz
            release-assets/BeatrixLeslieIDE-windows-x86_64.zip
            release-assets/SHA256SUMS.txt
