[package]
name = "spell_core"
version = "1.0.1"
edition = "2021"
publish = false
license = "MIT OR Apache-2.0"
description = "BeatrixLeslie IDE Standalone Rust Core (spell_core) — OpenAI-Compatible Endpoint Transport, Agent Loop, Headless Tools, Tags, MCP Stdio Client, SQLite3 Store & C-ABI FFI"

[lib]
name = "spell_core"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.154"
regex = "=1.13.1"
sha2 = "=0.10.9"
walkdir = "=2.5.0"
once_cell = "=1.21.4"
parking_lot = "=0.12.5"
httparse = "=1.10.1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls-native-roots", "gzip", "json"] }
directories = "5"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
sysinfo = "0.33"
flate2 = "1"
lopdf = "0.47"
libsqlite3-sys = { version = "0.40", features = ["bundled"] }

[target.'cfg(unix)'.dependencies]
libc = "=0.2.191"

[features]
# Test doubles (`test_support`: fixture engine + loopback/AF_UNIX verify servers) and the
# `spell_test_engine` binary for standalone integration tests. Never enabled for the app build.
test-support = []

[[bin]]
name = "spell_test_engine"
path = "src/bin/spell_test_engine.rs"
required-features = ["test-support"]

